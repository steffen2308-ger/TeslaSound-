name: APK-Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        shell: bash
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            manager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
            test -n "$manager"
            "$manager" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check sound engine without Android device
        run: bash tools/test_audio.sh
      - run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TeslaSound.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TeslaSound-APK
          path: |
            TeslaSound.apk
            Trabant-Synth-Preview.wav
          if-no-files-found: error
      - name: Publish APK as release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -oP "versionName '\K[^']+" app/build.gradle)"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest TeslaSound.apk Trabant-Synth-Preview.wav \
            --target "$GITHUB_SHA" \
            --title "TeslaSound $version (aktueller Build)" \
            --notes "Automatisch gebaute Debug-APK von main, Commit ${GITHUB_SHA::7}. Nur zum Testen." \
            --prerelease
