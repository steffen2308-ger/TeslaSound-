name: APK-Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        shell: bash
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            manager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
            test -n "$manager"
            "$manager" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare optional real engine recordings
        continue-on-error: true
        run: |
          python3 -m venv /tmp/teslasound-samples
          /tmp/teslasound-samples/bin/pip -q install numpy
          /tmp/teslasound-samples/bin/python tools/prepare_recordings.py
      - run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TeslaSound.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TeslaSound-APK
          path: |
            TeslaSound.apk
            app/src/main/assets/engines/sample-report.json
          if-no-files-found: error
